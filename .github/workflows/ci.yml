name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_LOCAL: developer-workspace:ci-${{ github.sha }}
  IMAGE_REMOTE: ghcr.io/${{ github.repository_owner }}/developer-workspace
  IMAGE_ARTIFACT: developer-workspace-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  verify:
    runs-on: ci-container
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint shell scripts
        run: |
          shellcheck_files=()
          while IFS= read -r path; do
            shellcheck_files+=("/mnt/$path")
          done < <(find scripts -maxdepth 1 -name '*.sh' -print)
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/mnt:ro" \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            "${shellcheck_files[@]}"

      - name: Resolve release coordinate
        id: release
        shell: bash
        run: |
          set -euo pipefail
          metadata=.release-metadata.yaml
          test -f "$metadata"

          wave=""
          batch=""
          generation=""
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*$ ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^(wave|batch|generation):[[:space:]]*([a-z0-9]+)[[:space:]]*$ ]]; then
              echo "Invalid release metadata line: $line" >&2
              exit 1
            fi
            key="${BASH_REMATCH[1]}"
            value="${BASH_REMATCH[2]}"
            case "$key" in
              wave)
                [[ -z "$wave" ]] || { echo "Duplicate wave" >&2; exit 1; }
                wave="$value"
                ;;
              batch)
                [[ -z "$batch" ]] || { echo "Duplicate batch" >&2; exit 1; }
                batch="$value"
                ;;
              generation)
                [[ -z "$generation" ]] || { echo "Duplicate generation" >&2; exit 1; }
                generation="$value"
                ;;
            esac
          done < "$metadata"

          [[ "$wave" =~ ^w[0-9]{2}$ ]] || { echo "Invalid or missing wave" >&2; exit 1; }
          [[ "$batch" =~ ^b[0-9]{2}$ ]] || { echo "Invalid or missing batch" >&2; exit 1; }
          if [[ -n "$generation" ]]; then
            [[ "$generation" =~ ^g[0-9]{2}$ ]] || { echo "Invalid generation" >&2; exit 1; }
          fi

          tag="$(TZ=Europe/Rome date +%Y.%m.%d)-${wave}-${batch}"
          if [[ -n "$generation" ]]; then
            tag="${tag}-${generation}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release coordinate: $tag"

      - name: Generate immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REMOTE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=sha,format=long

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build exact image artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: |
            ${{ env.IMAGE_LOCAL }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/developer-workspace.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load exact image artifact
        run: docker load --input /tmp/developer-workspace.tar

      - name: PID 1 orphan reaping regression
        run: bash scripts/test-init-reaping.sh "$IMAGE_LOCAL"

      - name: Smoke test
        run: >-
          docker run --rm
          -e MISE_GITHUB_TOKEN="${{ github.token }}"
          --entrypoint /usr/local/lib/developer-workspace/smoke-test.sh
          "$IMAGE_LOCAL"

      - name: Playwright Chromium acceptance
        run: >-
          docker run --rm
          -e MISE_GITHUB_TOKEN="${{ github.token }}"
          --entrypoint /usr/local/lib/developer-workspace/test-playwright-runtime.sh
          "$IMAGE_LOCAL"

      # Release coordinates are immutable. Publishing only the first attempt
      # prevents a rerun from overwriting the artifact selected by GitOps.
      - name: Preserve verified image artifact
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            github.ref == 'refs/heads/main' &&
            github.run_attempt == 1
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: /tmp/developer-workspace.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify]
    if: >-
      ${{
        needs.verify.result == 'success' &&
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main' &&
        github.run_attempt == 1
      }}
    runs-on: ci-container
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: /tmp

      - name: Load verified image artifact
        run: docker load --input /tmp/developer-workspace.tar

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse release-coordinate overwrite
        shell: bash
        env:
          RELEASE_REF: ${{ env.IMAGE_REMOTE }}:${{ needs.verify.outputs.release_tag }}
        run: |
          set -euo pipefail
          set +e
          inspect_output="$(docker manifest inspect "$RELEASE_REF" 2>&1)"
          inspect_status=$?
          set -e

          if (( inspect_status == 0 )); then
            echo "Release coordinate already exists and is immutable: $RELEASE_REF" >&2
            exit 1
          fi

          if grep -Eqi 'manifest unknown|no such manifest|not found' <<< "$inspect_output"; then
            echo "Release coordinate is available: $RELEASE_REF"
            exit 0
          fi

          echo "$inspect_output" >&2
          echo "Unable to prove release coordinate is unused; refusing publication." >&2
          exit 1

      - name: Publish immutable image tags
        run: docker push --all-tags "$IMAGE_REMOTE"
