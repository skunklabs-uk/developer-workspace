[containers]
# The Developer Workspace runtime is already resource-bounded by Kubernetes.
# Nested development containers do not create their own cgroups; this avoids
# requiring writable cgroup delegation inside the Pod.
cgroups = "disabled"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

[network]
# Rootless Podman uses userspace networking and does not need NET_ADMIN in the
# parent Pod. pasta is Podman's current default; keep the choice explicit.
default_rootless_network_cmd = "pasta"
