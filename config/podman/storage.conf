[storage]
driver = "vfs"
runroot = "/run/podman/storage"
graphroot = "/var/lib/podman/storage"
rootless_storage_path = "/var/lib/podman/storage"

[storage.options.vfs]
# The canary intentionally supports a single-UID rootless user namespace. VFS
# avoids /dev/fuse and this option squashes image ownership that cannot be
# represented by that single mapping.
ignore_chown_errors = "true"
